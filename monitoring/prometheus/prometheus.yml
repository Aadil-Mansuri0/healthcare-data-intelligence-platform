global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "healthcare-api"
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
        labels:
          service: "fastapi-backend"

  - job_name: "airflow"
    static_configs:
      - targets: ["airflow-webserver:8080"]
        labels:
          service: "airflow"

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
