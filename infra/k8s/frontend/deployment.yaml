apiVersion: apps/v1
kind: Deployment
metadata:
  name: healthcare-frontend
  namespace: healthcare
  labels:
    app: healthcare-frontend
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: healthcare-frontend
  template:
    metadata:
      labels:
        app: healthcare-frontend
    spec:
      containers:
        - name: frontend
          image: ${ECR_FRONTEND_REPO_URL}:${IMAGE_TAG}
          ports:
            - containerPort: 3000
          # NOTE: no NEXT_PUBLIC_API_URL env var here — it would be dead
          # configuration. Next.js inlines NEXT_PUBLIC_* variables into the
          # client bundle at `next build` time, not at container start, so
          # setting it here would silently have zero effect (a real bug
          # caught in review). The actual API URL is baked in at build time
          # via `docker build --build-arg NEXT_PUBLIC_API_URL=...` — see
          # .github/workflows/ci_cd.yml's frontend build step and
          # frontend/Dockerfile for where that value actually gets set.
          # If the API URL ever needs to change, it requires a rebuild, not
          # a redeploy of this manifest with a different value here.
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /login
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /login
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: healthcare-frontend-svc
  namespace: healthcare
spec:
  selector:
    app: healthcare-frontend
  ports:
    - port: 3000
      targetPort: 3000
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: healthcare-frontend-hpa
  namespace: healthcare
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: healthcare-frontend
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
# Ingress — routes public traffic to frontend (/) and api (/api) through a
# single ALB, with TLS termination via cert-manager (annotations below assume
# the standard ingress-nginx + cert-manager stack, installed via the Helm
# releases referenced in infra/helm/README.md).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: healthcare-ingress
  namespace: healthcare
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/rate-limit: "100"   # requests/min per IP — basic DDoS guard at the edge
spec:
  tls:
    - hosts:
        - healthcare-platform.example.com
        - api.healthcare-platform.example.com
      secretName: healthcare-tls-cert
  rules:
    - host: healthcare-platform.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: healthcare-frontend-svc
                port:
                  number: 3000
    - host: api.healthcare-platform.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: healthcare-api-svc
                port:
                  number: 8000
