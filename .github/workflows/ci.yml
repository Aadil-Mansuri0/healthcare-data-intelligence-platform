name: Healthcare Platform CI & GitHub Pages Live Deployment

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  frontend-build-and-deploy:
    name: Build & Deploy to GitHub Pages (Live Demo)
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm install

      - name: Build & Export Next.js Static App
        working-directory: ./frontend
        env:
          NEXT_PUBLIC_BASE_PATH: /healthcare-data-intelligence-platform
          NEXT_PUBLIC_API_URL: http://localhost:8000
        run: npm run build

      - name: Fix Jekyll metadata for GitHub Pages
        run: touch frontend/out/.nojekyll

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'frontend/out'

      - name: Deploy to GitHub Pages
        id: deployment
        if: github.ref == 'refs/heads/main'
        uses: actions/deploy-pages@v4

  backend-validation:
    name: Backend & Data Pipeline Syntax Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Python Syntax Verification
        run: |
          flake8 api compliance rag --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 api compliance rag --count --exit-zero --max-complexity=15 --max-line-length=127 --statistics

      - name: Setup Node.js 22.x for SQLite Seeder Test
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test Native SQLite Demo Database Seeder
        run: |
          node demo/seed_database.js
