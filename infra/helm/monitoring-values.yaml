# Helm values for prometheus-community/kube-prometheus-stack

grafana:
  adminPassword: "" # set via --set grafana.adminPassword=$GRAFANA_ADMIN_PASSWORD at install time, never committed
  ingress:
    enabled: true
    ingressClassName: "nginx"
    annotations:
      cert-manager.io/cluster-issuer: "letsencrypt-prod"
    hosts:
      - grafana.healthcare-platform.example.com
    tls:
      - secretName: grafana-tls-cert
        hosts:
          - grafana.healthcare-platform.example.com

  # Auto-provision the healthcare dashboard from a labeled ConfigMap instead
  # of manual import — apply this alongside:
  #   kubectl create configmap healthcare-dashboard \
  #     --from-file=monitoring/grafana/healthcare_dashboard.json \
  #     -n monitoring
  #   kubectl label configmap healthcare-dashboard grafana_dashboard=1 -n monitoring
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard

prometheus:
  prometheusSpec:
    retention: 15d
    resources:
      requests: { cpu: "500m", memory: "1Gi" }
      limits: { cpu: "1", memory: "2Gi" }
    # Auto-discovers any ServiceMonitor in the cluster matching this selector —
    # the healthcare-api Service needs a matching ServiceMonitor (below) to be scraped.
    serviceMonitorSelectorNilUsesHelmValues: false

alertmanager:
  enabled: true
  config:
    route:
      receiver: "default"
      routes:
        - match:
            severity: critical
          receiver: "critical-alerts"
    receivers:
      - name: "default"
      - name: "critical-alerts"
        # Wire to Slack/PagerDuty in real deployment:
        # slack_configs:
        #   - api_url: "$SLACK_WEBHOOK_URL"
        #     channel: "#healthcare-platform-alerts"
---
# ServiceMonitor — tells Prometheus (via the Operator installed by this chart)
# to scrape /metrics on the FastAPI service. Apply separately after the chart:
#   kubectl apply -f infra/helm/servicemonitor-api.yaml
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: healthcare-api-monitor
  namespace: healthcare
  labels:
    release: monitoring   # must match the Helm release name for auto-discovery
spec:
  selector:
    matchLabels:
      app: healthcare-api
  endpoints:
    - port: "http"
      path: /metrics
      interval: 15s
