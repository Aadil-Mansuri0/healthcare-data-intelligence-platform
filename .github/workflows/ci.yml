name: Healthcare Platform CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  frontend-build:
    name: Frontend Build & Typecheck (Next.js 14)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm install

      - name: Build Next.js Application
        working-directory: ./frontend
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000

  backend-validation:
    name: Backend & Data Pipeline Syntax Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Python Syntax Verification
        run: |
          flake8 api compliance rag --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 api compliance rag --count --exit-zero --max-complexity=15 --max-line-length=127 --statistics

      - name: Setup Node.js 22.x for SQLite Seeder Test
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test Native SQLite Demo Database Seeder
        run: |
          node demo/seed_database.js
