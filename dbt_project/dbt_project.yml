name: 'healthcare_platform'
version: '1.0.0'
config-version: 2

profile: 'healthcare_platform'

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  healthcare_platform:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: ephemeral
    marts:
      +materialized: table
      +schema: gold
      +snowflake_warehouse: HEALTHCARE_WH
